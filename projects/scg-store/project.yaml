name: SCG Store
slug: scg-store
testIdPrefix: SCG
description: SCG online store (Storeberry, Astro). Logged-in shopping journeys.

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with SCG_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
defaultEnv: staging
envs:
  staging:
    baseUrl: https://scg.next.mystoreberry.com
    allowWrites: true

# Playwright settings for this project (POM suite in tests/, see .agents/skills/qa-write-tests Part B).
# A test links to a test case when its title starts with the ID: test('SCG-001: ...').
playwright:
  testDir: tests/e2e
  browsers: [chromium]        # chromium | firefox | webkit | mobile; first one is the "scg-store" Playwright project
  fullyParallel: false        # tests share one store account and cart
  use:
    viewport: { width: 1440, height: 900 }

auth:
  accounts:
    - username: test account from .env
      roles: [customer]
      envUser: SCG_EMAIL
      envPass: SCG_PASSWORD
      notes: Shared test account; its cart persists between runs.

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
