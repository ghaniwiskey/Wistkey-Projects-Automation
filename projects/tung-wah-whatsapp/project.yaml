name: Tung Wah Whatsapp
slug: tung-wah-whatsapp
testIdPrefix: TWW
description: "Tung Wah (東華三院) WhatsApp Message Manager: Twilio WhatsApp templates, Excel contact upload, bulk send, reply stats and reports"

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with TWW_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
defaultEnv: local
envs:
  local:
    baseUrl: http://localhost:3000/
    allowWrites: false

# Playwright settings for this project (POM suite in tests/, see .agents/skills/qa-write-tests Part B).
# A test links to a test case when its title starts with the ID: test('TWW-001: ...').
playwright:
  testDir: tests/e2e
  browsers: [chromium]        # chromium | firefox | webkit | mobile; first one is the "tung-wah-whatsapp" Playwright project
  fullyParallel: true

# Test accounts: usernames only. Passwords go in .env as TWW_<ROLE>_USER / TWW_<ROLE>_PASS.
auth:
  accounts:
    - roles: [admin]
      notes: admin@tungwah.org (Next.js credentials login). Password in .env; editor/viewer accounts are created per test by the admin and deleted afterwards.
      envUser: TWW_ADMIN_USER
      envPass: TWW_ADMIN_PASS
    - roles: [admin]
      notes: QA admin for logout/login and role tests (sees only its own templates).
      envUser: TWW_QA_ADMIN_USER
      envPass: TWW_QA_ADMIN_PASS

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
