name: MHA Mobile
slug: mha-mobile
testIdPrefix: MHM
description: "MHA Mobile native Android app (com.iconsult.mhasgtwo) on the Android emulator: explored with mobile-mcp from Claude Code, automated with mobilewright (Playwright Test; npm run test:mhm). baseUrl is MHA web (UAT), used by the tests to set up and check what the phone did."

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with MHM_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
# MHA Mobile is a native app. baseUrl is MHA web on the same UAT backend: the tests use it (Playwright `page`)
# to set up data (FAVE stocktaker assignment) and to check what the phone sent. Never production.
# Each env also names the app's login agency and the .env variables of its accounts:
#   agency          login screen agency (SPF / HTA)
#   mobileAccount   prefix of the phone login vars (<prefix>_USER / <prefix>_PASS)
#   webAccount      prefix of the MHA web login vars; omitted = MHM_WEB_USER, else the mha-spf account (SPF_USER)
# Run HTA with QA_ENV=staging-hta.
defaultEnv: staging
envs:
  staging:
    baseUrl: https://mhauatweb.southeastasia.cloudapp.azure.com/
    allowWrites: true
    agency: SPF
    mobileAccount: MHM
  staging-hta:
    baseUrl: https://mhauatwebhta.southeastasia.cloudapp.azure.com/
    allowWrites: true
    agency: HTA
    mobileAccount: MHM_HTA
    webAccount: HTA

# Playwright settings for this project (POM suite in tests/, see .agents/skills/qa-write-tests Part B).
# A test links to a test case when its title starts with the ID: test('MHM-001: ...').
# runner mobilewright: the tests drive the app on the emulator and run with projects/mha-mobile/playwright.config.ts
# (npm run test:mhm); the root playwright.config.ts skips this project. See README.md.
playwright:
  runner: mobilewright
  testDir: tests/e2e

# Test accounts come from .env only: MHM_USER (mobile login = full NRIC; MHM_PASS empty on UAT) and, for the
# MHA web checks, MHM_WEB_USER / MHM_WEB_PASS (default: the mha-spf account SPF_USER / SPF_PASS).
auth:
  accounts: []

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
