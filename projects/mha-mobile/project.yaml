name: MHA Mobile
slug: mha-mobile
testIdPrefix: MHM
description: "MHA Mobile native Android app (com.iconsult.mhasgtwo) on the Android emulator: explored with mobile-mcp from Claude Code, automated with mobilewright (Playwright Test; npm run test:mhm). No web target: the placeholder URL keeps the project registered."

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with MHM_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
# MHA Mobile is a native app: there is no web target, so this .invalid placeholder keeps the project registered
# in the workspace (and makes the web smoke MHM-001 skip itself). Point it at a real URL if one ever exists.
defaultEnv: staging
envs:
  staging:
    baseUrl: https://mha-mobile.invalid/
    allowWrites: true

# Playwright settings for this project (POM suite in tests/, see .agents/skills/playwright-e2e).
# A test links to a test case when its title starts with the ID: test('MHM-001: ...').
# runner mobilewright: the tests drive the app on the emulator and run with projects/mha-mobile/playwright.config.ts
# (npm run test:mhm); the root playwright.config.ts skips this project. See README.md.
playwright:
  runner: mobilewright
  testDir: tests/e2e

# Test accounts: usernames only. Passwords go in .env as MHM_<ROLE>_USER / MHM_<ROLE>_PASS.
auth:
  accounts: []

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
