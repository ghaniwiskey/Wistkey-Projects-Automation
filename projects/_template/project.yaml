name: {{name}}
slug: {{slug}}
testIdPrefix: {{prefix}}
description: ""

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with {{prefix}}_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
defaultEnv: {{env}}
envs:
  {{env}}:
    baseUrl: {{baseUrl}}
    allowWrites: {{allowWrites}}

# Playwright settings for this project (POM suite in tests/, see .agents/skills/playwright-e2e).
# A test links to a test case when its title starts with the ID: test('{{prefix}}-001: ...').
playwright:
  testDir: tests/e2e
  browsers: [chromium]        # chromium | firefox | webkit | mobile; first one is the "{{slug}}" Playwright project
  fullyParallel: true

# Test accounts: usernames only. Passwords go in .env as {{prefix}}_<ROLE>_USER / {{prefix}}_<ROLE>_PASS.
auth:
  accounts: []

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
