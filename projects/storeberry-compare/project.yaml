name: Storeberry Flower Comparison
slug: storeberry-compare
testIdPrefix: SBF
description: Storeberry Flower customer-facing storefront smoke and cart checks. CRM coverage is in storeberry-crm.

# Environments. Pick one with QA_ENV=<name> (default: defaultEnv). Override the URL with SBF_BASE_URL.
# allowWrites: false skips tests tagged @writes on that env.
defaultEnv: staging
envs:
  staging:
    baseUrl: https://storeberry-flower.stagingl10.storeberry.xyz/
    allowWrites: true
  production:
    baseUrl: https://storeberry-flower.mystoreberry.com/
    allowWrites: false

# Playwright settings for this project (POM suite in tests/, see .agents/skills/playwright-e2e).
# A test links to a test case when its title starts with the ID: test('SBF-001: ...').
playwright:
  testDir: tests/e2e
  browsers: [chromium]        # chromium | firefox | webkit | mobile; first one is the "storeberry-compare" Playwright project
  fullyParallel: true

# Storefront checks are guest journeys. CRM credentials are configured in storeberry-crm.
auth:
  accounts: []

suites:
  smoke: { tags: [smoke], description: Fast checks of the main journeys }
  regression: { tags: [regression, smoke], description: Full regression }
